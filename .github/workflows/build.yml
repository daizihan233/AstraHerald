# 每次向 main 推送都会发一版：算滚动版本号 -> 打 NSIS 安装包 -> 发 GitHub Release -> 上传 OSS。
# 版本号格式 YYYYMM.D.N（例 202510.2.40 = 2025-10-02 的第 40 次构建），N 用 workflow run number。
# 参考同组织的 AstraSchedule/desktop 的 build.yml，只是 Tauri 只有 x64 单通道，
# 自动更新的元数据是 OSS 上的 latest.json（安装包本身由 tauri 签名，另可出 zip 形式）。
name: Rolling Build & Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 同一时刻只允许一条发布流水线跑：否则两条并发构建会各自算出不同版本号，
# 并互相覆盖 OSS 上的 latest.json（run 9 / run 10 就被这个坑过一次）。
concurrency:
  group: rolling-build
  cancel-in-progress: false

jobs:
  # 版本号只在这里算一次，经 job output 提供给后面的任务共用。
  # 若各任务各自 Get-Date：跨午夜/月末或失败重跑时两次算出的日期不同，会发布成两个 release。
  version:
    # 手动 dispatch 时 github.event.head_commit 是 null，显式放行，否则 dispatch 会静默跳过整个流水线。
    if: ${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'docs') }}
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.compute.outputs.ver }}
    steps:
      - id: compute
        name: Compute rolling version
        run: |
          # 语义化版本：YYYYMM.D.N（均为数字且无前导零）
          ym=$(date -u +%Y%m)
          dd=$(date -u +%-d)
          echo "ver=${ym}.$dd.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  build_and_publish:
    name: Build & Publish
    needs: version
    if: ${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'docs') }}
    permissions:
      contents: write
    runs-on: windows-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.OSS_SECRET_KEY }}
      AWS_DEFAULT_REGION: cn-east-1
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      # Rains3 会返回 SlowDown 限流；默认 3 次退避不够（run 40205436045 就挂在这），
      # adaptive 按服务端的限流信号自我调节重试节奏。
      AWS_RETRY_MODE: adaptive
      AWS_MAX_ATTEMPTS: '10'
      ENDPOINT: https://cn-nb1.rains3.com
      BUCKET: kuohu-objects
      PREFIX: AstraHerald/
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 'latest'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: bun install

      - name: Write version into package.json / tauri.conf.json / Cargo.toml
        shell: pwsh
        run: |
          $ver = '${{ needs.version.outputs.ver }}'

          $pkgPath = 'package.json'
          $pkg = Get-Content $pkgPath -Raw | ConvertFrom-Json
          $pkg.version = $ver
          $pkg | ConvertTo-Json -Depth 100 | Out-File -Encoding UTF8 $pkgPath

          # 安装包文件名与注册表里的版本都读这里，必须一起改
          $confPath = 'src-tauri/tauri.conf.json'
          $conf = Get-Content $confPath -Raw | ConvertFrom-Json
          $conf.version = $ver
          $conf | ConvertTo-Json -Depth 100 | Out-File -Encoding UTF8 $confPath

          $cargoPath = 'src-tauri/Cargo.toml'
          $cargo = Get-Content $cargoPath -Raw
          $cargo = $cargo -replace '(?m)^version\s*=\s*"[0-9][^"]*"', "version = `"$ver`""
          $cargo | Out-File -Encoding UTF8 $cargoPath

          Write-Host "Version: $ver"


      - name: Build NSIS installer (with signed updater artifacts)
        env:
          # 私钥存在仓库 Secret（内容就是 .secrets/updater.key 的文本）。密码留空也要显式传，
          # 否则 tauri 会交互式提问，在 CI 里直接挂住。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun x tauri build --bundles nsis

      - name: Collect installer, updater bundle and latest.json
        shell: pwsh
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          $ver = '${{ needs.version.outputs.ver }}'
          $dir = 'src-tauri/target/release/bundle/nsis'
          $installer = Get-ChildItem -Path $dir -File -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $installer) { Write-Error '没有找到 NSIS 安装包'; exit 1 }
          # 自动更新的产物由 tauri 的签名步骤产生：当前 CLI 直接签安装包本身（...setup.exe.sig），
          # 有的版本会另打一个 zip（...setup.exe.zip / .nsis.zip）。updater 两种都吃（zip 会解压取里面的 exe），
          # 谁在就用谁——url 与 signature 必须指向同一份产物。
          $zip = Get-ChildItem -Path $dir -File | Where-Object { $_.Name -like '*-setup*.zip' } | Select-Object -First 1
          if ($zip) {
            $payload = $zip.Name
            $sigPath = $zip.FullName + '.sig'
          } else {
            $payload = $installer.Name
            $sigPath = $installer.FullName + '.sig'
          }
          $sig = Get-Content $sigPath -Raw
          if (-not $sig) { Write-Error "没有找到自动更新的签名：$sigPath（createUpdaterArtifacts 打开了吗）"; exit 1 }

          New-Item -ItemType Directory -Path 'dist-release' -Force | Out-Null
          Copy-Item $installer.FullName 'dist-release/'
          Copy-Item ($installer.FullName + '.sig') 'dist-release/'
          if ($zip) {
            Copy-Item $zip.FullName 'dist-release/'
            Copy-Item ($zip.FullName + '.sig') 'dist-release/'
          }
          # 固定名字的别名：官网/注册中心的永久下载链接用这个，内容每次覆盖
          Copy-Item $installer.FullName 'dist-release/AstraHeraldInstaller.exe'

          # 客户端自动更新读这个文件：latest/ 里的产物地址 + 签名 + 版本。
          # 域名是 ESA 加速的静态域名，换镜像只要改这一处。
          $notes = ($env:COMMIT_MSG -split "\n")[0].Trim()
          if (-not $notes) { $notes = "AstraHerald $ver" }
          $latest = [ordered]@{
            version   = $ver
            notes     = $notes
            pub_date  = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd\THH:mm:ss\Z')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = $sig.Trim()
                url       = "https://static.getastra.cn/" + $env:PREFIX + "latest/" + $payload
              }
            }
          }
          # 必须无 BOM：updater 把这个文件当纯 JSON 解析。
          $latest | ConvertTo-Json -Depth 5 | Out-File -Encoding utf8NoBOM 'dist-release/latest.json'
          Write-Host "$($installer.Name)  $([math]::Round($installer.Length / 1MB, 2)) MB"
          Write-Host "updater payload: $payload（签名 $sigPath）"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = '${{ needs.version.outputs.ver }}'
          $tag = "v$ver"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --generate-notes --target $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $tag (Get-ChildItem 'dist-release' -File).FullName --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Release $tag 已更新"

      - name: Upload to OSS
        shell: pwsh
        run: |
          $ver = '${{ needs.version.outputs.ver }}'
          function Push-OSS([string]$local, [string]$key) {
            Write-Host "Uploading $key"
            aws s3 cp $local "s3://$env:BUCKET/$key" --endpoint-url "$env:ENDPOINT"
            if ($LASTEXITCODE -ne 0) { Write-Error "上传 $key 失败"; exit $LASTEXITCODE }
          }
          # 按版本归档 + latest 稳定目录（客户端自动更新读 latest/）
          foreach ($file in Get-ChildItem 'dist-release' -File) {
            Push-OSS $file.FullName "${env:PREFIX}$ver/$($file.Name)"
            Push-OSS $file.FullName "${env:PREFIX}latest/$($file.Name)"
          }
          Write-Host "OSS 上传完成：${env:PREFIX}$ver/ 与 ${env:PREFIX}latest/"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-release
          path: dist-release/**
          if-no-files-found: error

  # latest/ 里必须只留当前版本的产物：残留的旧安装包会让客户端下到过期文件。
  # 先校验 latest/ 上的安装包和本地打出来的完全等大，再删多余的 .exe。
  prune_oss_latest:
    name: Verify & prune OSS latest/
    needs: [version, build_and_publish]
    if: ${{ !startsWith(github.event.head_commit.message, 'docs') }}
    runs-on: windows-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.OSS_SECRET_KEY }}
      AWS_DEFAULT_REGION: cn-east-1
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      AWS_RETRY_MODE: adaptive
      AWS_MAX_ATTEMPTS: '10'
      ENDPOINT: https://cn-nb1.rains3.com
      BUCKET: kuohu-objects
      PREFIX: AstraHerald/latest/
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download the artifact we just built
        uses: actions/download-artifact@v4
        with:
          name: dist-release
          path: dist-release

      - name: Verify latest/ matches this build
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP 'oss-verify'
          foreach ($file in Get-ChildItem 'dist-release' -File) {
            $key = "$env:PREFIX$($file.Name)"
            # 不用 head-object：这家 S3 对 HEAD 返回 403（AstraSchedule 的 CI 也改用 get-object 校验）。
            aws s3api get-object --bucket $env:BUCKET --key $key --endpoint-url $env:ENDPOINT $tmp | Out-Null
            if ($LASTEXITCODE -ne 0) { Write-Error "读不到 $key"; exit $LASTEXITCODE }
            $remote = (Get-Item $tmp).Length
            if ([long]$remote -ne [long]$file.Length) {
              Write-Error "::error::$key 远端大小 $remote 与本次构建 $($file.Length) 不一致"
              exit 1
            }
            Write-Host "OK: $($file.Name) -> $remote bytes"
          }

      - name: Delete objects that are not part of this version
        shell: pwsh
        run: |
          $ver = '${{ needs.version.outputs.ver }}'
          $prefix = $env:PREFIX
          # 本版本自己的产物——安装包、自动更新用的 zip（若有）、各种 .sig——名字里都有 AstraHerald_<ver>，
          # 加上固定名字的别名与 latest.json，其余对象（上一版的残留）全部删掉。
          $keepPrefix = "AstraHerald_$ver"
          $keep = @('AstraHeraldInstaller.exe', 'latest.json')
          $listed = aws s3api list-objects-v2 --bucket $env:BUCKET --prefix $prefix --endpoint-url $env:ENDPOINT --query 'Contents[].Key' --output text
          if ($LASTEXITCODE -ne 0) { Write-Error '列出 latest/ 对象失败'; exit $LASTEXITCODE }
          $keys = @($listed -split '\s+') | Where-Object { $_ -and $_ -ne 'None' }
          Write-Host "Current version: $ver"
          foreach ($key in $keys) {
            $name = $key.Substring($prefix.Length)
            if ($keep -contains $name -or $name.StartsWith($keepPrefix)) { Write-Host "keep: $key"; continue }
            Write-Host "delete: $key"
            aws s3 rm "s3://$env:BUCKET/$key" --endpoint-url $env:ENDPOINT
            if ($LASTEXITCODE -ne 0) { Write-Error "删除 $key 失败"; exit $LASTEXITCODE }
          }
          Write-Host "OSS $env:PREFIX 现在只保留 $ver 的产物"

# 客户端自动更新读 https://static.getastra.cn/AstraHerald/latest/latest.json（ESA 加速的静态域名）。
# 换镜像/换域名要同时改这里与 src-tauri/tauri.conf.json 的 plugins.updater.endpoints。
# 签名私钥不进仓库：.secrets/updater.key 是本地那一份，CI 用 repo secrets。